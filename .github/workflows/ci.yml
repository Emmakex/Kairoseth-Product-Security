name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Run npm test
        run: npm test 2>&1 | tee test-output.log
      - name: Upload failing test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output.log
          retention-days: 3
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run audit:prod

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t kairoseth-product-security:ci .
